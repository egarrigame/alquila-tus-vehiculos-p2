<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Alquileres</title></head>
<body>
<header>
  <h1>AlquilaTusVehiculos</h1>
  <nav>
    <a th:href="@{/clientes}">Clientes</a> |
    <a th:href="@{/vehiculos}">Vehículos</a> |
    <a th:href="@{/alquileres}">Alquileres</a>
  </nav>
  <hr/>
</header>

<h2>Listado de alquileres</h2>
<a th:href="@{/alquileres/create}">+ Nuevo Alquiler</a>

<table border="1" cellpadding="6" cellspacing="0">
  <thead><tr><th>ID</th><th>Cliente</th><th>Fecha inicio</th><th>Fecha fin</th><th>Importe</th><th>Acciones</th></tr></thead>
  <tbody>
  <tr th:each="a : ${alquileres}">
    <td th:text="${a.id}">1</td>
    <td th:text="${a.cliente != null ? a.cliente.nombre : 'N/A'}">Cliente</td>
    <td th:text="${a.fechaInicio}">2025-01-01</td>
    <td th:text="${a.fechaFin}">2025-01-05</td>
    <td th:text="${a.importeTotal}">0.0</td>
    <td>
      <a th:href="@{|/alquileres/delete/${a.id}|}" onclick="return confirm('¿Borrar alquiler?')">Borrar</a>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
